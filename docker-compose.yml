services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app/backend
      - ./training:/app/training
      - ./sample:/app/sample
      - ./.env:/app/.env
      - model_cache:/root/.cache
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5001

volumes:
  model_cache:
